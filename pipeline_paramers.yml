# CellPhenotyper runtime parameters
# Usage:
#   nextflow run main.nf -profile singularity -params-file pipeline_paramers.yml -resume

# Starting point (inputs)
# Multi-sample mode (recommended): set `folder_input` and keep image/roi null.
# Single-sample mode: set `image_input` (and optionally `roi_geojson`).
image_input: null
roi_geojson: null
folder_input: Data

# Endpoint (outputs)
outdir_base: results_full

# Pipeline mode
run_full_pipeline: true
tissue_mask_from_input: false
compute_device: cpu    # cpu | gpu | auto
host_arch: auto        # auto | amd64 | arm64
enable_gpu_on_arm64: false   # set true only when an arm64-compatible GPU container is available
enable_stardist_gpu_on_arm64: false   # optional override: run StarDist in GPU container on arm64
runtime_image_mode: auto   # auto | manual
docker_extra_run_options: ""  # optional site-specific bind mounts or Docker flags
start_point: convert
end_point: auto
# Allowed stage names for start/end:
# convert, grandqc, stardist, cell_consensus, tma, tissue_mask, cell_assignment, cytoplasm, gigatime,
# marker_quantification, uni2, kodama, clustering, cluster_mask, grow_tissue, cluster_geojson,
# neoplastic_section, titan, pathofmpred

# Runtime image selection
# In `runtime_image_mode: auto`, singularity tries local .sif first, then ORAS-hosted
# prebuilt SIF tags in GHCR, then legacy release assets, then docker:// fallback.
# On arm64 GPU requests, missing GPU assets fall back to CPU containers unless
# `gpu_container_image` is explicitly provided.
# Keep image fields empty unless you intentionally force a manual image.
container_repo: ghcr.io/tkcaccia/cellphenotyper
container_gpu_repo: ghcr.io/tkcaccia/cellphenotyper-runtime
container_cpu_tag: 2.6   # legacy generic fallback; use arch-specific tags below
container_cpu_tag_amd64: 2.6-amd64
container_cpu_tag_arm64: 2.6-arm64
container_gpu_tag: 2.7-gpu-amd64
singularity_image_source: auto   # auto | oras | release | docker
singularity_gpu_image_source: docker   # use the verified GPU OCI runtime through Singularity/Apptainer
singularity_oras_repo: ghcr.io/tkcaccia/cellphenotyper
singularity_cpu_oras_tag_amd64: 2.6-sif-amd64
singularity_cpu_oras_tag_arm64: 2.6-sif-arm64
singularity_gpu_oras_tag_amd64: 2.6-sif-gpu-amd64
singularity_gpu_oras_tag_arm64: 2.6-sif-gpu-arm64
singularity_release_repo: tkcaccia/CellPhenotyper
singularity_release_tag: v2.6
singularity_cpu_asset_amd64: cellphenotyper-2.6-amd64.sif
singularity_cpu_asset_arm64: cellphenotyper-2.6-arm64.sif
singularity_gpu_asset_amd64: cellphenotyper-2.6-gpu-amd64.sif
singularity_gpu_asset_arm64: cellphenotyper-2.6-gpu-arm64.sif
singularity_local_dir: ""   # optional local dir with prebuilt .sif (checked before docker fallback)
singularity_cache_dir: ""   # optional apptainer cache dir (defaults to <repo>/.apptainer_cache)
cpu_container_image: ""     # optional explicit CPU container path/URI
gpu_container_image: ""     # optional explicit GPU container path/URI
singularity_image: ""
docker_image: ""
gpu_debug_diagnostics: false

# Global resource caps
max_cpus: 4
max_memory_gb: 8

# Input-resolution contract. The strict default rejects missing/invalid MPP,
# anisotropic pixels, and source images coarser than 0.50 µm/px before conversion.
input_resolution_check: true
input_resolution_strict: true
input_resolution_validator_script: bin/validate_input_resolution.py
input_resolution_min_mpp: 0.05
input_resolution_max_mpp: 0.50
input_resolution_cell_target_mpp: 0.25
input_resolution_max_anisotropy_fraction: 0.05
input_resolution_max_conversion_drift_fraction: 0.02
input_resolution_override_mpp: 0.0

medsam_refine_memory_gb: 30
medsam_refine_max_workers: 2
stardist_pythonpath: ""
stardist_prob: 0.52
stardist_nms: 0.28
stardist_min_area: 120
stardist_crop_pad: 0
stardist_autoinstall_runtime: true
stardist_tensorflow_version: "2.16.2"
stardist_big_mode: auto
stardist_big_threshold_mpix: 120.0
write_full_labels: false
full_format: zarr
allow_huge_tif: false

# Three-model nuclei segmentation and consensus. HoVer-Net MoNuSAC and
# CellViT++ require the GPU image and run serially on the StarDist crop to cap VRAM.
cell_consensus_enable: true
hovernet_target_mpp: 0.25
hovernet_default_mpp: 0.25
hovernet_batch_size: 0   # 0 = auto-scale from detected GPU VRAM
hovernet_postproc_workers: 0
hovernet_prediction_cache: ''
hovernet_chunk_shape: 10000
hovernet_tile_shape: 2048
cellvit_model: HIPT
cellvit_taxonomy: pannuke
cellvit_batch_size: 0    # 0 = auto-scale from detected GPU VRAM
cellvit_ray_workers: 1   # must be >=1 with CellViT++ 1.0.9
cellvit_ray_worker_cpus: 0  # 0 = divide task CPUs across Ray workers
cellvit_amp: true
cellvit_default_mpp: 0.25
cell_consensus_min_support: 2
cell_consensus_match_radius_um: 4.0
cell_consensus_geometry_priority: cellvitpp,hovernet
cell_consensus_tile_size: 512
cell_consensus_preview_max_side: 3000

# Optional post-clustering TITAN + PathoFMPred path. The cancer code is never
# inferred from the filename because applying a cancer-specific model to the
# wrong population is invalid. This breast benchmark uses BRCA.
titan_enable: false
titan_cache_dir: ../.cache/hf_titan
titan_offline: true
titan_target_mpp: 0.5
titan_patch_size: 512
titan_min_tissue_coverage: 0.2
titan_batch_size: 0
neoplastic_section_require_cells: true
neoplastic_section_padding_um: 256.0
pathofmpred_enable: false
pathofmpred_rscript: /opt/micromamba/envs/kodama-r/bin/Rscript
pathofmpred_cancer: ""
pathofmpred_library_dir: ../.cache/pathofmpred/R_library
pathofmpred_report_format: html
pathofmpred_include_limited_evidence: false
tissue_auto_no_downsample_max_side: 1024
expand_full_labels: true
expand_mode: auto
expand_tile_size: 2048
expand_auto_threshold_mpix: 25.0
expand_preview_factor: 10
expand_preview_threshold_mb: 100.0
expand_preview_alpha: 0.45
# `copy` keeps results valid after deleting the Nextflow work directory.
# Use `rellink` only when retaining the matching work cache is intentional.
publish_dir_mode: copy
grandqc_enable: true
grandqc_device: auto
grandqc_bootstrap_deps: false
grandqc_download_models: false
grandqc_create_geojson: true
grandqc_cache_dir: .cache/grandqc
grandqc_default_source_mpp: 0.25
grandqc_artifact_mpp_model: auto
grandqc_tissue_mpp_model: 10.0
grandqc_patch_size: 512
grandqc_artifact_tile_size: 0
grandqc_artifact_overlap_fraction: 0.5
grandqc_overlay_factor: 10
grandqc_preview_max_side: 4096
tma_enable: true
tma_thumbnail_max_side: 2048
tma_min_spots: 4
tma_min_spot_area_fraction: 0.001
tma_max_spot_area_fraction: 0.25
tma_max_area_cv: 0.75
tma_min_circularity: 0.25
tma_min_solidity: 0.50
tma_max_eccentricity: 0.98
tma_grid_tolerance_fraction: 0.75
tma_close_radius: 48
tma_cpus: 4
tma_memory_gb: 12
tma_time: 4h
input_roi_mask_label_mode: auto
input_roi_mask_value_prop: value
input_roi_mask_annotation_props: classification.name,classification.label,class,label,type,name
input_roi_mask_default_value: 1
input_roi_mask_preview_factor: 10
input_roi_mask_preview_threshold_mb: 100.0
input_roi_mask_preview_alpha: 0.45
gigatime_enable: true
gigatime_target_mpp: 0.25
gigatime_strict_target_mpp: true
gigatime_output_format: zarr
gigatime_output_dtype: uint8
gigatime_output_channels: DAPI,PD-1,CD3,CD8,PD-L1
gigatime_output_pyramid: true
gigatime_export_ometiff: true
gigatime_export_channels: ''
gigatime_export_output_dtype: auto
gigatime_export_compression: deflate
gigatime_export_tile_size: 1024
gigatime_export_cpus: 4
gigatime_export_memory_gb: 16
gigatime_export_time: 12h
gigatime_integrated_quantification: true
gigatime_blockwise: true
gigatime_block_size: 2048
gigatime_output_predictor: false
gigatime_output_compression: jpeg
gigatime_jpg_markers: DAPI,PD-1,CD3,CD8,PD-L1
gigatime_jpg_quality: 75
gigatime_jpg_preview_max_side: 4096
gigatime_jpg_save_tiles: false
gigatime_skip_background_blocks: true
gigatime_skip_background_downsample: 32
gigatime_skip_background_min_fraction: 0.02
gigatime_skip_background_close_radius: 8
gigatime_skip_background_min_obj_area: 2048
gigatime_skip_background_hole_area: 2048
gigatime_max_output_gib: 8.0
gigatime_disk_buffer_threshold_gib: 4.0
marker_quantification_enable: true

# UNI-2 token variable name
# Hugging Face model cache defaults are resolved in `nextflow.config` to a
# parent-level shared cache so sibling pipeline clones reuse the same blobs.
hf_token_env_file: tokens.env
hf_token_env_var_name: HF_UNI2
uni2_include_nuclei: false
uni2_include_cyto: false
uni2_include_inner_square: true
uni2_fuse_tile_inner_square: true
uni2_force_full_image: false
uni2_save_tiles: false
uni2_target_mpp: 0.25
uni2_default_source_mpp: 0.25
uni2_mask_context_mode: label
uni2_inner_square_factor: 1.0
uni2_inner_square_min_px: 32
uni2_inner_square_max_px: 0
uni2_inner_square_fixed_px: 90

# KODAMA embedding source:
# tile | nuclei | cyto | inner_square | any comma-separated combination | all
kodama_rscript: /opt/micromamba/envs/kodama-r/bin/Rscript
kodama_r_library_dir: /opt/micromamba/envs/kodama-r/lib/R/library
kodama_embedding_mode: tile,inner_square
kodama_dims_to_run: 20
kodama_spark_top_features: 100
kodama_n_cores: 4
kodama_backend: cpu
kodama_gpu_device: 0

# Clustering defaults (Louvain on KODAMA embedding)
cluster_r_library_dir: /opt/micromamba/envs/stardist/lib/R/library
cluster_kodama_dim: 20
cluster_snn_k: 30
cluster_resolution: auto

# Cluster mask preview (overlay on crop_roi.tif)
cluster_mask_compression: zlib
cluster_mask_preview_factor: 10
cluster_mask_preview_threshold_mb: 100.0
cluster_mask_preview_alpha: 0.45

# Grown tissue preview (same overlay style as cluster mask preview)
grow_preview_factor: 10
grow_preview_threshold_mb: 100.0
grow_preview_alpha: 0.45
medsam_cluster_tile_size: 4096
medsam_cluster_tile_overlap: 512
