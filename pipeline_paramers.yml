# CellPhenotyper runtime parameters
# Usage:
#   nextflow run main.nf -profile singularity -params-file pipeline_paramers.yml -resume

# Starting point (inputs)
image_input: Data/ROI.ome.tif
roi_geojson: Data/ROI.geojson

# Endpoint (outputs)
outdir_base: results_full

# Pipeline mode
run_full_pipeline: true
tissue_mask_from_input: false
compute_device: auto  # cpu | gpu | auto
host_arch: auto      # auto | amd64 | arm64
start_point: convert
end_point: auto
# Allowed stage names for start/end:
# convert, stardist, tissue_mask, tissue_geojson, cell_assignment, cytoplasm, uni2,
# kodama, clustering, cluster_mask, grow_tissue, cluster_geojson

# Runtime image selection
# CPU default image tags from GHCR
# For GPU, switch both to tag suffix -gpu (example: 0.2.0-gpu)
#
# Optional fully-automatic selector (recommended): leave both empty
# You can force architecture detection if needed:
# host_arch: amd64
# and let Nextflow choose by architecture/device.
# singularity_image: ""
# docker_image: ""
#
# Optional tag controls used by auto-selection
# container_repo: ghcr.io/tkcaccia/cellphenotyper
# container_cpu_tag: 0.2.0
# container_cpu_tag_amd64: ""
# container_cpu_tag_arm64: ""
# container_gpu_tag: 0.2.0-gpu
container_repo: ghcr.io/tkcaccia/cellphenotyper
container_cpu_tag: 0.2.0
container_cpu_tag_amd64: 0.2.0-amd64
container_cpu_tag_arm64: 0.2.0
container_gpu_tag: 0.2.0-gpu
singularity_image: ""
docker_image: ""

# Global resource caps
max_cpus: 8
max_memory_gb: 32
stardist_pythonpath: ""
expand_full_labels: true
expand_mode: auto
expand_tile_size: 2048
expand_auto_threshold_mpix: 25.0

# UNI-2 token variable name
hf_token_env_file: tokens.env
hf_token_env_var_name: HF_UNI2
uni2_include_cyto: true
