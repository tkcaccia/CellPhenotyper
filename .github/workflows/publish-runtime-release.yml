name: Publish Runtime Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag suffix (for example 2.2)
        required: true
        default: "2.2"

env:
  IMAGE_REPO: ghcr.io/tkcaccia/cellphenotyper
  TF_WHEEL_NAME: tensorflow-2.22.0.dev0+selfbuilt-cp311-cp311-linux_x86_64.whl

jobs:
  docker-publish:
    name: Docker ${{ matrix.tag }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.full.cpu
            platform: linux/amd64
            tag: amd64
            gpu: "false"
            runs_on: ubuntu-latest
          - dockerfile: docker/Dockerfile.full.cpu
            platform: linux/arm64
            tag: arm64
            gpu: "false"
            runs_on: ubuntu-24.04-arm
          - dockerfile: docker/Dockerfile.full.gpu
            platform: linux/amd64
            tag: gpu-amd64
            gpu: "true"
            runs_on: ubuntu-latest
          - dockerfile: docker/Dockerfile.full.gpu
            platform: linux/arm64
            tag: gpu-arm64
            gpu: "true"
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPO }}:${{ inputs.version }}-${{ matrix.tag }}
          build-args: |
            STARDIST_TF_WHEEL_URL=https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/${{ env.TF_WHEEL_NAME }}

  docker-manifests:
    name: Docker manifest tags
    runs-on: ubuntu-latest
    needs: docker-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Create multi-arch tags
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          REPO="${IMAGE_REPO}"
          docker buildx imagetools create \
            -t "${REPO}:${VERSION}" \
            "${REPO}:${VERSION}-amd64" \
            "${REPO}:${VERSION}-arm64"

          docker buildx imagetools create \
            -t "${REPO}:${VERSION}-gpu" \
            "${REPO}:${VERSION}-gpu-amd64" \
            "${REPO}:${VERSION}-gpu-arm64"

          docker buildx imagetools inspect "${REPO}:${VERSION}-amd64"
          docker buildx imagetools inspect "${REPO}:${VERSION}-arm64"
          docker buildx imagetools inspect "${REPO}:${VERSION}-gpu-amd64"
          docker buildx imagetools inspect "${REPO}:${VERSION}-gpu-arm64"
          docker buildx imagetools inspect "${REPO}:${VERSION}"
          docker buildx imagetools inspect "${REPO}:${VERSION}-gpu"

  singularity-assets:
    name: SIF ${{ matrix.docker_tag }}
    runs-on: ${{ matrix.runs_on }}
    needs: docker-manifests
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            docker_tag: amd64
            asset_arch: amd64
            runs_on: ubuntu-latest
          - device: cpu
            docker_tag: arm64
            asset_arch: arm64
            runs_on: ubuntu-24.04-arm
          - device: gpu
            docker_tag: gpu-amd64
            asset_arch: amd64
            runs_on: ubuntu-latest
          - device: gpu
            docker_tag: gpu-arm64
            asset_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer and GitHub CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer gh

      - name: Build and publish SIF
        env:
          GH_TOKEN: ${{ github.token }}
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}
          SINGULARITY_DOCKER_USERNAME: ${{ github.actor }}
          SINGULARITY_DOCKER_PASSWORD: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/apptainer/tmp /var/tmp/apptainer/cache /var/tmp/apptainer/out
          ./singularity/publish_sif_release_asset.sh \
            --version "${{ inputs.version }}" \
            --source docker \
            --device "${{ matrix.device }}" \
            --docker-repo "${IMAGE_REPO}" \
            --docker-tag "${{ inputs.version }}-${{ matrix.docker_tag }}" \
            --oras-repo "${IMAGE_REPO}" \
            --upload-mode auto \
            --asset-arch "${{ matrix.asset_arch }}" \
            --tmpdir /var/tmp/apptainer/tmp \
            --cachedir /var/tmp/apptainer/cache \
            --outdir /var/tmp/apptainer/out \
            --force \
            --upload
