name: Publish Runtime Release

on:
  push:
    tags:
      - "runtime-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag suffix (for example 2.7)
        required: true
        default: "2.7"
      publish_target:
        description: Build the complete matrix or refresh only the amd64 GPU runtime
        required: true
        default: gpu-amd64-update
        type: choice
        options:
          - gpu-amd64-update
          - all

env:
  IMAGE_REPO: ghcr.io/tkcaccia/cellphenotyper
  TF_WHEEL_NAME: tensorflow-2.22.0.dev0+selfbuilt-cp311-cp311-linux_x86_64.whl

jobs:
  release_version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#runtime-v}"
            version="${version%%-build*}"
          else
            version="${DISPATCH_VERSION}"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]]
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  docker-publish:
    name: Docker ${{ matrix.tag }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'all' }}
    runs-on: ${{ matrix.runs_on }}
    needs: release_version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.full.cpu
            platform: linux/amd64
            tag: amd64
            gpu: "false"
            runs_on: ubuntu-latest
          - dockerfile: docker/Dockerfile.full.cpu
            platform: linux/arm64
            tag: arm64
            gpu: "false"
            runs_on: ubuntu-24.04-arm
          - dockerfile: docker/Dockerfile.full.gpu
            platform: linux/amd64
            tag: gpu-amd64
            gpu: "true"
            runs_on: ubuntu-latest
          - dockerfile: docker/Dockerfile.full.gpu
            platform: linux/arm64
            tag: gpu-arm64
            gpu: "true"
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPO }}:${{ needs.release_version.outputs.version }}-${{ matrix.tag }}
          build-args: |
            STARDIST_TF_WHEEL_URL=https://github.com/${{ github.repository }}/releases/download/v${{ needs.release_version.outputs.version }}/${{ env.TF_WHEEL_NAME }}

  docker-manifests:
    name: Docker manifest tags
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'all' }}
    runs-on: ubuntu-latest
    needs:
      - release_version
      - docker-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch tags
        run: |
          set -euo pipefail
          VERSION="${{ needs.release_version.outputs.version }}"
          REPO="${IMAGE_REPO}"
          docker buildx imagetools create \
            -t "${REPO}:${VERSION}" \
            "${REPO}:${VERSION}-amd64" \
            "${REPO}:${VERSION}-arm64"

          docker buildx imagetools create \
            -t "${REPO}:${VERSION}-gpu" \
            "${REPO}:${VERSION}-gpu-amd64" \
            "${REPO}:${VERSION}-gpu-arm64"

          docker buildx imagetools inspect "${REPO}:${VERSION}-amd64"
          docker buildx imagetools inspect "${REPO}:${VERSION}-arm64"
          docker buildx imagetools inspect "${REPO}:${VERSION}-gpu-amd64"
          docker buildx imagetools inspect "${REPO}:${VERSION}-gpu-arm64"
          docker buildx imagetools inspect "${REPO}:${VERSION}"
          docker buildx imagetools inspect "${REPO}:${VERSION}-gpu"

  singularity-assets:
    name: SIF ${{ matrix.docker_tag }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'all' }}
    runs-on: ${{ matrix.runs_on }}
    needs:
      - release_version
      - docker-manifests
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            docker_tag: amd64
            asset_arch: amd64
            runs_on: ubuntu-latest
          - device: cpu
            docker_tag: arm64
            asset_arch: arm64
            runs_on: ubuntu-24.04-arm
          - device: gpu
            docker_tag: gpu-amd64
            asset_arch: amd64
            runs_on: ubuntu-latest
          - device: gpu
            docker_tag: gpu-arm64
            asset_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer and GitHub CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer gh

      - name: Build and publish SIF
        env:
          GH_TOKEN: ${{ github.token }}
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ github.token }}
          SINGULARITY_DOCKER_USERNAME: ${{ github.actor }}
          SINGULARITY_DOCKER_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/apptainer/tmp /var/tmp/apptainer/cache /var/tmp/apptainer/out
          ./singularity/publish_sif_release_asset.sh \
            --version "${{ needs.release_version.outputs.version }}" \
            --source docker \
            --device "${{ matrix.device }}" \
            --docker-repo "${IMAGE_REPO}" \
            --docker-tag "${{ needs.release_version.outputs.version }}-${{ matrix.docker_tag }}" \
            --oras-repo "${IMAGE_REPO}" \
            --upload-mode auto \
            --asset-arch "${{ matrix.asset_arch }}" \
            --tmpdir /var/tmp/apptainer/tmp \
            --cachedir /var/tmp/apptainer/cache \
            --outdir /var/tmp/apptainer/out \
            --force \
            --upload

  gpu-amd64-update:
    name: Docker gpu-amd64 dependency/source update
    if: ${{ github.event_name == 'push' || inputs.publish_target == 'gpu-amd64-update' }}
    runs-on: ubuntu-latest
    needs: release_version
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push amd64 GPU update
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime-update.gpu
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REPO }}:2.6-gpu
          tags: ${{ env.IMAGE_REPO }}:${{ needs.release_version.outputs.version }}-gpu-amd64

      - name: Verify published runtime
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}:${{ needs.release_version.outputs.version }}-gpu-amd64"
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" bash -lc '
            set -euo pipefail
            test "$R_LIBS_USER" = /opt/cellphenotyper/empty-r-library
            /opt/micromamba/envs/stardist/bin/python -c "import conch, torch, transformers; assert torch.backends.cuda.is_built(); assert transformers.__version__.split(chr(46))[0] == chr(52)"
            /opt/micromamba/envs/kodama-r/bin/Rscript -e "library(KODAMA); library(fastPLS); library(ggplot2); library(rmarkdown)"
            grep -q "if ivalue > block" /opt/cellphenotyper/bin/run_stardist_roi_segmentation.py
            grep -q "03d_cell_consensus" /opt/cellphenotyper/UPSTREAM_DIFFS.md
          '
