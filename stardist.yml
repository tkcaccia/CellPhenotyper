name: stardist
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # Ensure modern GNU C++ runtime in the env (fixes CXXABI mismatches on some hosts)
  - libstdcxx-ng>=13
  - libgcc-ng>=13

  # Core scientific + image I/O
  - numpy<2
  - scipy
  - pandas
  - scikit-image
  - matplotlib-base
  - tqdm
  - pillow
  - tifffile
  - h5py
  - imagecodecs<2025

  # Geometry / geospatial
  - shapely

  # WSI + tiled image handling
  - zarr<3

  # Deep learning (UNI-2)
  - pytorch
  - torchvision

  # UNI-2 model loading
  - huggingface_hub
  - transformers>=4.51,<5
  - timm
  - accelerate
  - safetensors
  - einops
  - einops-exts

  # StarDist stack installed through pip for ARM compatibility
  - pip:
    - stardist
    - csbdeep
